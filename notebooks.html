<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Notebooks | Les Hyperion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Lora:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
  <style>

    :root{--bg:#0b0f14;--bg2:#111820;--bg3:#1a2535;--border:rgba(100,160,220,0.15);--text:#e8eef5;--text-muted:#7a96b0;--text-faint:#3d5168;--accent:#4a9eff;--accent2:#38c98a;--accent3:#f5a623;--card-bg:rgba(22,32,48,0.75);--card-border:rgba(74,158,255,0.12);--shadow:0 8px 40px rgba(0,0,0,0.5);--font-d:'Syne',sans-serif;--font-b:'Lora',serif;--font-m:'DM Mono',monospace;--radius:16px;--ease:cubic-bezier(0.4,0,0.2,1);}
    [data-theme="light"]{--bg:#f0f4f8;--bg2:#e4eaf2;--bg3:#d4dde9;--border:rgba(60,110,180,0.15);--text:#111b2a;--text-muted:#4a6080;--text-faint:#98b0c8;--accent:#1a6fd4;--accent2:#1a9e68;--accent3:#d4820e;--card-bg:rgba(255,255,255,0.9);--card-border:rgba(26,111,212,0.15);--shadow:0 8px 40px rgba(80,120,180,0.12);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-b);line-height:1.7;overflow-x:hidden;transition:background .35s,color .35s;}
    img{max-width:100%;}a{color:inherit;text-decoration:none;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}

    nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,5vw,3rem);background:rgba(11,15,20,.88);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--border);transition:background .35s;}
    [data-theme="light"] nav{background:rgba(240,244,248,.88);}
    .nav-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:1rem;color:var(--text);letter-spacing:.02em;}
    .nav-logo{height:34px;width:34px;object-fit:contain;border-radius:6px;}
    .nav-logo-fallback{display:none;font-size:1.5rem;}
    .nav-logo.broken{display:none;}.nav-logo.broken~.nav-logo-fallback{display:block;}
    .nav-right{display:flex;align-items:center;gap:1.4rem;}
    .nav-links{display:flex;align-items:center;gap:1.8rem;list-style:none;}
    .nav-links a{font-family:var(--font-d);font-size:.78rem;font-weight:600;color:var(--text-muted);letter-spacing:.07em;text-transform:uppercase;transition:color .2s;position:relative;padding-bottom:2px;}
    .nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .22s;}
    .nav-links a:hover,.nav-links a.active{color:var(--accent);}
    .nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
    .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}
    .hamburger span{display:block;width:22px;height:2px;background:var(--text-muted);border-radius:2px;transition:all .3s;}
    .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
    .hamburger.open span:nth-child(2){opacity:0;}
    .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
    .nav-drawer{position:fixed;top:60px;left:0;right:0;z-index:999;background:var(--bg2);border-bottom:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .4s,padding .3s;}
    .nav-drawer.open{max-height:320px;padding:.5rem 0;}
    .nav-drawer ul{list-style:none;display:flex;flex-direction:column;}
    .nav-drawer ul li a{display:block;padding:.85rem clamp(1rem,5vw,3rem);font-family:var(--font-d);font-size:.88rem;font-weight:600;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);transition:color .2s,background .2s;}
    .nav-drawer ul li a:hover{color:var(--accent);background:var(--bg3);}
    .theme-toggle{background:none;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--text-muted);font-family:var(--font-d);font-size:.72rem;font-weight:600;letter-spacing:.05em;transition:all .2s;white-space:nowrap;}
    .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
    [data-theme="light"] .moon-icon{display:none;}[data-theme="dark"] .sun-icon{display:none;}

    .page-wrap{max-width:1180px;margin:0 auto;padding:clamp(80px,12vh,110px) clamp(1.2rem,5vw,3rem) clamp(4rem,8vh,6rem);}
    .page-header{margin-bottom:clamp(2rem,4vw,3rem);}
    .page-back{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:.72rem;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.5rem;transition:color .2s;}
    .page-back:hover{color:var(--accent);}
    .page-eyebrow{font-family:var(--font-m);font-size:.7rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.7rem;display:flex;align-items:center;gap:9px;}
    .page-eyebrow::before{content:'';display:block;width:22px;height:1px;background:var(--accent);}
    .page-title{font-family:var(--font-d);font-size:clamp(1.9rem,4vw,3rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;}
    .page-desc{color:var(--text-muted);margin-top:.7rem;font-size:clamp(.88rem,1.4vw,1rem);}

    .filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:2rem;}
    .filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-d);font-size:.73rem;font-weight:600;letter-spacing:.06em;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

    .notebooks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1.4rem;}
    .notebook-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;transition:transform .28s,box-shadow .28s,border-color .28s;cursor:pointer;position:relative;}
    .notebook-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--accent);}
    .notebook-preview{height:155px;position:relative;overflow:hidden;}
    .nb-pattern{position:absolute;inset:0;padding:1.1rem;font-family:var(--font-m);font-size:.62rem;line-height:1.75;color:var(--text-faint);overflow:hidden;}
    .nb-cell-head{color:var(--accent);margin-bottom:3px;}
    .nb-code-line{color:var(--accent2);}
    .nb-out-line{border-left:2px solid var(--accent);padding-left:7px;color:var(--text-muted);margin-top:6px;}
    .nb-type-badge{position:absolute;top:.8rem;right:.8rem;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:6px;padding:2px 9px;font-family:var(--font-m);font-size:.58rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;}
    [data-theme="light"] .nb-type-badge{background:rgba(255,255,255,.8);}
    .notebook-body{padding:1.2rem 1.4rem;border-top:1px solid var(--border);}
    .notebook-meta{display:flex;align-items:center;gap:.9rem;margin-bottom:.65rem;flex-wrap:wrap;}
    .nb-date{font-family:var(--font-m);font-size:.62rem;color:var(--text-faint);}
    .nb-cat{font-family:var(--font-m);font-size:.6rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;}
    .notebook-title{font-family:var(--font-d);font-size:1rem;font-weight:700;line-height:1.3;margin-bottom:.45rem;}
    .notebook-desc{color:var(--text-muted);font-size:.82rem;line-height:1.65;margin-bottom:.9rem;}
    .notebook-keywords{display:flex;flex-wrap:wrap;gap:5px;}
    .kw{background:rgba(56,201,138,.08);border:1px solid rgba(56,201,138,.2);color:var(--accent2);font-family:var(--font-m);font-size:.58rem;padding:2px 7px;border-radius:20px;}
    .nb-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border);}
    .nb-author{font-family:var(--font-m);font-size:.62rem;color:var(--text-faint);}
    .nb-open-btn{font-family:var(--font-d);font-size:.7rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px;transition:gap .18s;}
    .notebook-card:hover .nb-open-btn{gap:9px;}
    .nb-loader{text-align:center;padding:4rem 2rem;font-family:var(--font-m);font-size:.8rem;color:var(--text-faint);letter-spacing:.1em;}
    .nb-loader-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 3px;animation:bounce 1.2s ease-in-out infinite;}
    .nb-loader-dot:nth-child(2){animation-delay:.15s;}.nb-loader-dot:nth-child(3){animation-delay:.3s;}
    @keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.4;}40%{transform:scale(1);opacity:1;}}
    .empty-state{grid-column:1/-1;text-align:center;padding:4rem 2rem;font-family:var(--font-m);font-size:.78rem;color:var(--text-faint);}
    .empty-state strong{color:var(--text-muted);display:block;font-size:1rem;margin-bottom:.5rem;font-family:var(--font-d);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(7,10,15,.93);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:clamp(.5rem,3vw,2rem);}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .notebook-viewer{width:min(960px,100%);height:min(88vh,940px);background:var(--bg2);border:1px solid var(--card-border);border-radius:clamp(12px,2vw,20px);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 28px 90px rgba(0,0,0,.75);transform:translateY(18px);transition:transform .3s;}
    .modal-overlay.open .notebook-viewer{transform:translateY(0);}
    .viewer-topbar{background:var(--bg3);border-bottom:1px solid var(--border);padding:.85rem 1.3rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:1rem;}
    .viewer-dots{display:flex;gap:7px;flex-shrink:0;}
    .viewer-dot{width:11px;height:11px;border-radius:50%;}
    .vd-r{background:#ff5f57;}.vd-y{background:#febc2e;}.vd-g{background:#28c840;}
    .viewer-title{font-family:var(--font-m);font-size:.72rem;color:var(--text-muted);letter-spacing:.05em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .viewer-actions{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
    .viewer-close{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1.15rem;transition:color .2s;padding:4px;}
    .viewer-close:hover{color:var(--text);}
    .viewer-content{overflow-y:auto;flex:1;padding:clamp(1.2rem,3vw,2.2rem);}

    /* NOTEBOOK DOC */
    .nb-doc{max-width:700px;margin:0 auto;}
    .nb-doc-header{border-bottom:1px solid var(--border);padding-bottom:1.4rem;margin-bottom:1.8rem;}
    .nb-doc-title{font-family:var(--font-d);font-size:clamp(1.3rem,3vw,1.85rem);font-weight:800;line-height:1.2;margin-bottom:.7rem;}
    .nb-doc-meta{display:flex;flex-wrap:wrap;gap:.9rem 1.8rem;font-family:var(--font-m);font-size:.68rem;color:var(--text-faint);}
    .nb-doc-meta strong{color:var(--text-muted);}
    .nb-doc-abstract{background:rgba(74,158,255,.05);border-left:3px solid var(--accent);padding:.9rem 1.1rem;border-radius:0 8px 8px 0;font-style:italic;color:var(--text-muted);font-size:.93rem;margin-bottom:1.3rem;}
    .nb-keywords-block{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:1.8rem;}
    .nb-kw-label{font-family:var(--font-m);font-size:.65rem;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;margin-right:4px;}
    .nb-h1{font-family:var(--font-d);font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:700;margin:2rem 0 .8rem;padding-bottom:.45rem;border-bottom:1px solid var(--border);}
    .nb-h2{font-family:var(--font-d);font-size:clamp(.95rem,2vw,1.1rem);font-weight:600;margin:1.4rem 0 .6rem;color:var(--accent2);}
    .nb-h3{font-family:var(--font-d);font-size:.98rem;font-weight:600;margin:1.2rem 0 .5rem;color:var(--text-muted);}
    .nb-h4{font-family:var(--font-m);font-size:.78rem;font-weight:600;margin:1rem 0 .4rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;}
    .nb-p{color:var(--text-muted);line-height:1.88;margin-bottom:.9rem;font-size:.94rem;}
    .nb-p strong{color:var(--text);font-weight:700;}.nb-p em{font-style:italic;}.nb-p a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}
    .nb-p code{font-family:var(--font-m);font-size:.82em;background:var(--bg3);padding:1px 5px;border-radius:4px;color:var(--accent2);}
    .nb-ul{list-style:none;margin:.5rem 0 1rem;display:flex;flex-direction:column;gap:4px;}
    .nb-ul li{color:var(--text-muted);font-size:.94rem;line-height:1.7;padding-left:1.2rem;position:relative;}
    .nb-ul li::before{content:"&#x2014;";position:absolute;left:0;color:var(--accent);font-size:.7rem;top:.3rem;}
    .nb-ul li strong{color:var(--text);}
    .nb-ul li a{color:var(--accent);}
    .nb-code-block{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.1rem;}
    .nb-code-topbar{background:var(--bg3);padding:5px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
    .nb-code-lang{font-family:var(--font-m);font-size:.6rem;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;}
    .nb-code-num{font-family:var(--font-m);font-size:.58rem;color:var(--text-faint);background:rgba(74,158,255,.1);padding:1px 6px;border-radius:4px;}
    .nb-code-copy{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 9px;cursor:pointer;color:var(--text-faint);font-family:var(--font-m);font-size:.58rem;letter-spacing:.06em;transition:all .2s;margin-left:auto;}
    .nb-code-copy:hover,.nb-code-copy.copied{border-color:var(--accent2);color:var(--accent2);}
    .nb-code-content{padding:.9rem 1.1rem;font-family:var(--font-m);font-size:clamp(.68rem,1.5vw,.78rem);line-height:1.7;color:var(--text);white-space:pre;overflow:auto;display:block;max-height:380px;}
    .nb-output-block{background:rgba(56,201,138,.04);border:1px solid rgba(56,201,138,.15);border-radius:8px;padding:.75rem 1.1rem;margin-bottom:1.1rem;font-family:var(--font-m);font-size:clamp(.65rem,1.4vw,.76rem);color:var(--text-muted);max-height:200px;overflow:auto;resize:vertical;}
    .nb-output-block pre{white-space:pre;overflow:visible;margin:0;}
    .nb-out-label{font-size:.58rem;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
    .nb-img-wrap{margin:1.2rem 0;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--bg3);text-align:center;padding:.5rem;}
    .nb-img-wrap img{display:inline-block;max-width:100%;height:auto;border-radius:6px;}
    .nb-img-caption{font-family:var(--font-m);font-size:.68rem;color:var(--text-faint);text-align:center;padding:.5rem 1rem .8rem;font-style:italic;}
    .nb-figure{margin:1.5rem 0;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--bg3);}
    .nb-figure img{display:block;max-width:100%;height:auto;margin:0 auto;padding:.5rem;}
    .nb-caption{font-family:var(--font-m);font-size:.7rem;color:var(--text-faint);text-align:center;padding:.5rem 1rem .8rem;font-style:italic;border-top:1px solid var(--border);}

    /* SYNTAX HIGHLIGHT */
    code[class*="language-"],pre[class*="language-"]{color:#abb2bf;}
    .token.comment,.token.prolog{color:#5c6370;font-style:italic;}
    .token.number,.token.boolean,.token.constant{color:#e06c75;}
    .token.string,.token.char,.token.inserted{color:#98c379;}
    .token.keyword,.token.atrule{color:#c678dd;}
    .token.function,.token.class-name{color:#61afef;}
    .token.variable,.token.regex{color:#e5c07b;}
    .token.operator,.token.punctuation{color:#abb2bf;}
    [data-theme="light"] code[class*="language-"]{color:#383a42;}
    [data-theme="light"] .token.comment{color:#a0a1a7;}
    [data-theme="light"] .token.string{color:#50a14f;}
    [data-theme="light"] .token.keyword{color:#a626a4;}
    [data-theme="light"] .token.function{color:#4078f2;}
    [data-theme="light"] .token.number{color:#986801;}

    .fade-up{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s;}
    .fade-up.visible{opacity:1;transform:translateY(0);}

    footer{border-top:1px solid var(--border);padding:1.6rem clamp(1.2rem,5vw,3rem);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;font-family:var(--font-m);font-size:.66rem;color:var(--text-faint);}
    .footer-brand{font-family:var(--font-d);font-weight:700;color:var(--text-muted);font-size:.82rem;}

    @media(max-width:900px){.nav-links{display:none;}.hamburger{display:flex;}}
    @media(max-width:640px){.notebooks-grid{grid-template-columns:1fr;}}
  
    .search-wrap{{position:relative;margin-bottom:1.2rem;}}
    .search-input{{width:100%;padding:.7rem 1rem .7rem 2.6rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font-m);font-size:.82rem;outline:none;transition:border-color .2s;}}
    .search-input:focus{{border-color:var(--accent);}}
    .search-icon{{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}}
    .results-count{{font-family:var(--font-m);font-size:.7rem;color:var(--text-faint);margin-bottom:1rem;letter-spacing:.06em;}}
  </style>
</head>
<body>
{NAV_HTML("notebooks")}
<div class="page-wrap">
  <a href="index.html" class="page-back">&#x2190; Back to Home</a>
  <div class="page-header fade-up">
    <div class="page-eyebrow">Portfolio</div>
    <h1 class="page-title">All Notebooks</h1>
    <p class="page-desc">Every notebook from my research, coursework and independent analyses. Filter by category or search by keyword.</p>
  </div>
  <div class="search-wrap">
    <span class="search-icon">&#x1F50D;</span>
    <input class="search-input" id="search-input" type="search" placeholder="Search notebooks by title, keyword or category...">
  </div>
  <div class="filter-bar" id="filter-bar"></div>
  <div class="results-count" id="results-count"></div>
  <div class="notebooks-grid" id="notebooks-grid">
    <div class="nb-loader">
      <div style="margin-bottom:1rem"><span class="nb-loader-dot"></span><span class="nb-loader-dot"></span><span class="nb-loader-dot"></span></div>
      Loading notebooks...
    </div>
  </div>
</div>
{FOOTER}
{MODAL_HTML}
<script>
{THEME_BOOT}
{NB_INDEX_JS}
{SHARED_JS}

const CATEGORIES=["All","GIS","Remote Sensing","Biodiversity","Biostatistics","Research"];
let activeFilter="All"; let allNotebooks=[]; let searchQuery="";

async function loadNotebooks(){{
  try{{
    let index;
    try{{const res=await fetch('notebooks/index.json');if(res.ok)index=await res.json();}}catch(_){{}}
    if(!index||!index.length)index=NOTEBOOK_INDEX;
    const results=await Promise.allSettled(index.map((meta,i)=>fetchAndParse(meta,i+1)));
    const parsed=results.filter(r=>r.status==='fulfilled'&&r.value).map(r=>r.value);
    allNotebooks=parsed.length?parsed.filter(n=>n.file!=='About_Me.ipynb'):[];
  }}catch(e){{allNotebooks=[];}}
  renderAll();
  observeFadeUps();
}}

async function fetchAndParse(meta,id){{
  try{{const res=await fetch(`notebooks/${{meta.file}}`);if(!res.ok)return null;const ipynb=await res.json();return{{id,...meta,...parseIpynb(ipynb,meta)}};}}catch{{return null;}}
}}

function getFiltered(){{
  return allNotebooks.filter(nb=>{{
    const catOk=activeFilter==='All'||nb.category===activeFilter;
    const q=searchQuery.toLowerCase();
    const searchOk=!q||(nb.title+' '+(nb.keywords||[]).join(' ')+' '+nb.category+' '+nb.desc).toLowerCase().includes(q);
    return catOk&&searchOk;
  }});
}}

function renderAll(){{
  document.getElementById('filter-bar').innerHTML=CATEGORIES.map(c=>`<button class="filter-btn${{c===activeFilter?' active':''}}" onclick="setFilter('${{c}}')">${{c}}</button>`).join('');
  const list=getFiltered();
  document.getElementById('results-count').textContent=`${{list.length}} notebook${{list.length!==1?'s':''}} found`;
  const grid=document.getElementById('notebooks-grid');
  if(!list.length){{grid.innerHTML=`<div class="empty-state"><strong>No notebooks found</strong>Try a different filter or search term.</div>`;return;}}
  grid.innerHTML=list.map(nb=>nbCard(nb)).join('');
  observeFadeUps();
}}

function setFilter(c){{activeFilter=c;renderAll();}}

document.addEventListener('DOMContentLoaded',function(){{
  const currentTheme=document.documentElement.getAttribute('data-theme')||'dark';
  document.getElementById('theme-label').textContent=currentTheme==='dark'?'Light':'Dark';
  document.getElementById('footer-year').textContent=new Date().getFullYear();
  document.addEventListener('keydown',e=>{{if(e.key==='Escape')closeModal();}});
  document.addEventListener('click',e=>{{const d=document.getElementById('nav-drawer');const b=document.getElementById('hamburger');if(d&&d.classList.contains('open')&&!d.contains(e.target)&&!b.contains(e.target))closeNav();}});
  document.getElementById('search-input').addEventListener('input',function(){{searchQuery=this.value;renderAll();}});
  loadNotebooks();
  observeFadeUps();
}});
</script>
{PRISM_SCRIPTS}
</body>
</html>
