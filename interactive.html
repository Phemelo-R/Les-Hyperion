<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Runner — Les Hyperion</title>
  <link rel="stylesheet" href="assets/css/rebrand.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Les Hyperion — Interactive</h1>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="interactive.html" aria-current="page">Interactive</a>
      </nav>
      <div class="controls">
        <button id="toggle-theme" aria-label="Toggle theme">Toggle theme</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="tool card">
      <div class="toolbar">
        <label for="language">Language</label>
        <select id="language" aria-label="Language">
          <option value="python">Python (Pyodide)</option>
          <option value="r">R (WebR)</option>
        </select>

        <button id="load-runtime">Load runtimes</button>
        <button id="run-btn" disabled>Run</button>
        <button id="clear-console">Clear</button>
        <span id="runtime-status" class="status">Runtimes: not loaded</span>
      </div>

      <div class="editor-pane">
        <textarea id="code" aria-label="Code editor" spellcheck="false"></textarea>
        <div class="examples">
          <button data-snippet="py-plot" class="example-btn">Python plot</button>
          <button data-snippet="py-numpy" class="example-btn">Python numpy</button>
          <button data-snippet="r-plot" class="example-btn">R plot</button>
          <button data-snippet="r-summary" class="example-btn">R summary</button>
        </div>
      </div>

      <div class="output card">
        <h3>Console output</h3>
        <pre id="console" class="console" aria-live="polite"></pre>
        <div id="plot-container" class="plot-container"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>Les Hyperion — Interactive runner</small>
    </div>
  </footer>

  <script type="module" src="assets/js/runner.mjs"></script>
</body>
</html>
