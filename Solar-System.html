<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Les Hyperion — Solar System Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:rgba(215,228,255,1);--dim:rgba(170,192,238,.45);--faint:rgba(140,170,220,.2);--bg:rgba(3,6,18,.88);--brd:rgba(90,130,210,.18)}
html,body{width:100%;height:100%;background:#00000c;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);cursor:crosshair;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse 78% 78% at 50% 50%,transparent 35%,rgba(0,0,12,.6) 100%)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(to bottom,transparent,transparent 3px,rgba(0,0,0,.018) 3px,rgba(0,0,0,.018) 4px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.corner{position:absolute;width:26px;height:26px;border-color:var(--brd);border-style:solid}
.c-tl{top:18px;left:18px;border-width:1px 0 0 1px}.c-tr{top:18px;right:18px;border-width:1px 1px 0 0}
.c-bl{bottom:18px;left:18px;border-width:0 0 1px 1px}.c-br{bottom:18px;right:18px;border-width:0 1px 1px 0}
.hrule{position:absolute;height:1px;background:var(--brd);left:18px;right:18px}
#rt{top:70px}#rb{bottom:70px}
#logo{position:absolute;top:26px;left:34px;pointer-events:auto}
#logo a{text-decoration:none;color:inherit}
#logo-name{font-size:clamp(13px,2vw,20px);font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:rgba(220,232,255,.9);line-height:1}
#logo-sub{font-family:'Inconsolata',monospace;font-size:clamp(7px,.85vw,9px);font-weight:300;letter-spacing:.42em;text-transform:uppercase;color:var(--dim);margin-top:6px}
#tele{position:absolute;top:26px;right:34px;text-align:right;font-family:'Inconsolata',monospace;font-size:clamp(8px,.85vw,10px);font-weight:300;letter-spacing:.22em;color:var(--dim);line-height:2.3}
#tele b{color:rgba(200,218,255,.62);font-weight:400}
.data-source{font-size:7px;color:rgba(100,150,220,.5);margin-top:4px}
#timebar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;pointer-events:auto;background:var(--bg);border:1px solid var(--brd);padding:9px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#timebar button{background:none;border:1px solid var(--brd);color:var(--dim);font-family:'Inconsolata',monospace;font-size:9px;letter-spacing:.2em;padding:5px 9px;cursor:pointer;transition:all .2s}
#timebar button:hover{color:var(--ink);border-color:rgba(160,190,240,.4)}
#timebar button.on{color:rgba(180,210,255,.8);border-color:rgba(130,170,230,.5)}
#simdate{font-family:'Inconsolata',monospace;font-size:9px;letter-spacing:.18em;color:var(--dim);min-width:160px;text-align:center}
#hint{position:absolute;bottom:26px;left:34px;font-family:'Inconsolata',monospace;font-size:clamp(7px,.8vw,9px);font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);line-height:2.4}
#panel{position:absolute;top:50%;right:34px;transform:translateY(-50%);background:var(--bg);border:1px solid var(--brd);padding:18px 24px 20px;width:280px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:none;opacity:0;transition:opacity .35s ease;max-height:70vh;overflow-y:auto}
#panel.show{opacity:1;pointer-events:auto}
#p-back{position:absolute;top:9px;right:11px;background:none;border:none;color:var(--dim);font-family:'Inconsolata',monospace;font-size:8px;letter-spacing:.3em;cursor:pointer;pointer-events:auto;text-transform:uppercase}
#p-back:hover{color:var(--ink)}
#p-name{font-size:clamp(16px,2.4vw,21px);font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:rgba(225,235,255,.92);margin-bottom:2px}
#p-type{font-family:'Inconsolata',monospace;font-size:9px;letter-spacing:.26em;color:var(--dim)}
.pdiv{width:30px;height:1px;background:var(--brd);margin:11px 0}
#p-data{font-family:'Inconsolata',monospace;font-size:8px;letter-spacing:.15em;color:var(--dim);line-height:2.2}
#p-data b{color:rgba(200,218,255,.6);font-weight:400}
#p-fact{font-style:italic;font-size:10px;line-height:1.65;color:var(--dim);margin-top:11px;border-top:1px solid var(--brd);padding-top:9px}
#p-source{font-family:'Inconsolata',monospace;font-size:7px;color:rgba(100,180,255,.6);margin-top:9px;padding-top:9px;border-top:1px solid var(--brd)}
#loader{position:fixed;inset:0;background:#00000c;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 1.4s ease}
#lt{font-size:clamp(20px,3.5vw,34px);font-weight:300;letter-spacing:.42em;text-transform:uppercase;color:rgba(210,228,255,.85)}
#ls{font-family:'Inconsolata',monospace;font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
#lp{width:160px;height:1px;background:rgba(100,150,220,.12);overflow:hidden;position:relative}
#lp::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:rgba(155,190,255,.75);animation:lp 2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes lp{to{left:0}}
.olabel{position:fixed;pointer-events:none;font-family:'Inconsolata',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,218,255,.5);white-space:nowrap;transform:translate(10px,-50%);z-index:3}
</style>
</head>
<body>
<div id="loader"><div id="lt">Les Hyperion</div><div id="ls">Calibrating ephemeris...</div><div id="lp"></div></div>
<canvas id="c"></canvas>
<div id="vignette"></div><div id="scanlines"></div>
<div id="hud">
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="hrule" id="rt"></div><div class="hrule" id="rb"></div>
  <div id="logo"><a href="https://phemelo-r.github.io/Les-Hyperion/"><div id="logo-name">Les Hyperion</div><div id="logo-sub">Solar System · Professional Edition</div></a></div>
  <div id="tele">
    <div>FOCUS &nbsp;<b id="tf">Solar System</b></div>
    <div>DIST &nbsp;&nbsp;<b id="td">—</b></div>
    <div>DATE &nbsp;&nbsp;<b id="tdt">—</b></div>
    <div>SPEED &nbsp;<b id="ts">—</b></div>
    <div class="data-source">JPL Horizons · NASA</div>
  </div>
  <div id="panel">
    <button id="p-back" onclick="window._deselect()">← Back</button>
    <div id="p-name">—</div><div id="p-type">—</div>
    <div class="pdiv"></div><div id="p-data"></div>
    <div id="p-fact"></div><div id="p-source"></div>
  </div>
  <div id="hint">
    <div>Click &nbsp;·&nbsp; Select object</div>
    <div>Drag &nbsp;·&nbsp; Orbit camera</div>
    <div>Scroll &nbsp;·&nbsp; Zoom</div>
    <div>Esc &nbsp;·&nbsp; Reset view</div>
  </div>
  <div id="timebar">
    <button onclick="window._speed(1)">1×</button>
    <button onclick="window._speed(3600)">1h/s</button>
    <button class="on" onclick="window._speed(86400)">1d/s</button>
    <button onclick="window._speed(2592000)">1mo/s</button>
    <button id="pbtn" onclick="window._play()">⏸ Pause</button>
    <div id="simdate">—</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// JPL HORIZONS EPHEMERIS (2026)
// https://ssd.jpl.nasa.gov/horizons/app.html
const H={
  mercury:{a:.38710,e:.20563,i:7.0051,L:75.5671,w:77.4518,O:48.3309,M0:253.3894,p:87.969},
  venus:  {a:.72333,e:.00677,i:3.3947,L:131.5638,w:131.7658,O:76.6799,M0:181.9790,p:224.701},
  earth:  {a:1.00000,e:.01671,i:0.0000,L:100.4656,w:102.9409,O:0.0000,M0:100.4656,p:365.256},
  mars:   {a:1.52366,e:.09341,i:1.8506,L:355.4333,w:336.0406,O:49.5574,M0:19.3730,p:686.971},
  jupiter:{a:5.20336,e:.04839,i:1.3053,L:34.3515,w:14.7661,O:100.5176,M0:20.0202,p:4332.89},
  saturn: {a:9.53707,e:.05386,i:2.4845,L:49.9432,w:92.5904,O:113.6655,M0:317.0225,p:10759.22},
  uranus: {a:19.1913,e:.04725,i:.7699,L:313.2323,w:170.9542,O:74.0096,M0:142.2386,p:30688.5},
  neptune:{a:30.0690,e:.00859,i:1.7700,L:304.8804,w:46.6871,O:131.7806,M0:256.2250,p:60182.4}
};

const P=[
  {id:'mercury',e:H.mercury,name:'Mercury',type:'Rocky terrestrial planet',r:2439.7,m:3.3011e23,d:5.514,g:3.7,t:{a:167},rot:58.646,mo:0,comp:'Silicate rock with Fe core',fact:'Mercury has the most elliptical orbit. Surface temps vary 610°C between day and night.',src:'NASA JPL, MESSENGER',c:0x8C7853},
  {id:'venus',e:H.venus,name:'Venus',type:'Rocky terrestrial planet',r:6051.8,m:4.8675e24,d:5.204,g:8.87,t:{a:464},rot:-243.018,mo:0,comp:'Silicate rock, CO₂ atmosphere',fact:'Venus rotates retrograde. One day (243 Earth days) is longer than its year (225 days).',src:'NASA JPL, Akatsuki',c:0xFFC649},
  {id:'earth',e:H.earth,name:'Earth',type:'Rocky terrestrial planet',r:6371.0,m:5.9722e24,d:5.514,g:9.81,t:{a:15},rot:0.9973,mo:1,comp:'Silicate rock, H₂O, N₂/O₂',fact:'Only known biosphere. Moon stabilizes 23.5° tilt, driving seasons.',src:'NOAA, USGS, NASA',c:0x4A90E2},
  {id:'mars',e:H.mars,name:'Mars',type:'Rocky terrestrial planet',r:3389.5,m:6.4171e23,d:3.933,g:3.71,t:{a:-65},rot:1.0259,mo:2,comp:'Silicate rock, iron oxide dust',fact:'Olympus Mons (22 km) and Valles Marineris (7 km) are largest volcano and canyon in solar system.',src:'USGS Astrogeology',c:0xE27B58},
  {id:'jupiter',e:H.jupiter,name:'Jupiter',type:'Gas giant',r:69911,m:1.8982e27,d:1.326,g:24.79,t:{a:-110},rot:0.4135,mo:95,comp:'H₂/He atmosphere',fact:'Great Red Spot is a storm wider than Earth, persisting 350+ years.',src:'NASA Horizons, JUNO',c:0xC88B3A},
  {id:'saturn',e:H.saturn,name:'Saturn',type:'Gas giant + rings',r:58232,m:5.6834e26,d:.687,g:10.44,t:{a:-140},rot:0.4440,mo:146,comp:'H₂/He atmosphere',fact:'Rings span 282,000 km but are ~10 m thick. Mostly ice and rock particles.',src:'NASA, Cassini',c:0xFAD5A5},
  {id:'uranus',e:H.uranus,name:'Uranus',type:'Ice giant',r:25362,m:8.6810e25,d:1.271,g:8.87,t:{a:-195},rot:-.7200,mo:27,comp:'H₂O/CH₄/NH₃ ices',fact:'Tilted 98°—rolls around Sun. Coldest atmosphere at −224°C.',src:'NASA, Voyager 2',c:0x4FD0E7},
  {id:'neptune',e:H.neptune,name:'Neptune',type:'Ice giant',r:24622,m:1.02413e26,d:1.638,g:11.15,t:{a:-200},rot:0.6713,mo:16,comp:'H₂O/CH₄/NH₃ ices',fact:'Fastest winds at 2,100 km/h. Moon Triton orbits backwards.',src:'NASA, Voyager 2',c:0x4166F5}
];

// RENDERER
const W=window.innerWidth,H_=window.innerHeight;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H_);
renderer.setClearColor(0x00000c,1);

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,W/H_,0.001,9000);
camera.position.set(0,20,45);camera.lookAt(0,0,0);

// TIME
const EPOCH=new Date('2026-01-01T00:00:00Z').getTime();
let simDay=(new Date('2026-04-04T14:00:00Z').getTime()-EPOCH)/86400000;
let simSpeed=86400,playing=true,lastT=performance.now();

function tickSim(){const now=performance.now();const dt=(now-lastT)/1000;lastT=now;if(playing)simDay+=simSpeed*dt/86400;}
function simDate(){return new Date(EPOCH+simDay*86400000);}
window._speed=function(s){simSpeed=s;document.querySelectorAll('#timebar button').forEach(b=>{if(b.id==='pbtn')return;const t=b.textContent;b.className=(s===1&&t==='1×'||s===3600&&t==='1h/s'||s===86400&&t==='1d/s'||s===2592000&&t==='1mo/s')?'on':'';});};
window._play=function(){playing=!playing;document.getElementById('pbtn').textContent=playing?'⏸ Pause':'▶ Play';};

// KEPLER SOLVER
function meanToTrue(M,e){let E=M;for(let i=0;i<10;i++)E=M+e*Math.sin(E);return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));}

function planetPos(e,day){
  const n=360/e.p,M=(e.M0+n*day)%360,Mr=M*Math.PI/180,v=meanToTrue(Mr,e.e),r=e.a*(1-e.e*e.e)/(1+e.e*Math.cos(v));
  const ir=e.i*Math.PI/180,wr=e.w*Math.PI/180,Or=e.O*Math.PI/180;
  const x=r*(Math.cos(Or)*Math.cos(wr+v)-Math.sin(Or)*Math.sin(wr+v)*Math.cos(ir));
  const y=r*(Math.sin(Or)*Math.cos(wr+v)+Math.cos(Or)*Math.sin(wr+v)*Math.cos(ir));
  const z=r*(Math.sin(wr+v)*Math.sin(ir));
  return new THREE.Vector3(x,y,z);
}

// STARS
function buildStars(){
  const N=5000,pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N);
  let seed=137;const rng=()=>{seed^=seed<<13;seed^=seed>>17;seed^=seed<<5;return((seed>>>0)/0xFFFFFFFF);};
  const phi=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){
    const y=1-(i/(N-1))*2,r=Math.sqrt(Math.max(0,1-y*y)),theta=phi*i,d=880+rng()*400;
    pos[i*3]=Math.cos(theta)*r*d;pos[i*3+1]=y*d;pos[i*3+2]=Math.sin(theta)*r*d;
    const T=3000+rng()*5000,b=Math.pow(1/T*1000,0.4);
    col[i*3]=Math.min(1,1+(b-1)*0.5);col[i*3+1]=Math.min(1,1+(b-1)*0.3);col[i*3+2]=Math.min(1,b);
    sz[i]=rng()<0.93?0.35+rng()*1.5:2+rng()*3.5;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.ShaderMaterial({uniforms:{uT:{value:0},uPR:{value:renderer.getPixelRatio()}},vertexShader:'attribute float aSize;attribute vec3 aColor;varying vec3 vC;uniform float uT,uPR;void main(){vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.);float d=length(mv.xyz);float tw=1.+.12*sin(uT*1.8+position.x*.009+position.z*.011);gl_PointSize=aSize*uPR*tw*(820./d);gl_Position=projectionMatrix*mv;}',fragmentShader:'varying vec3 vC;void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);if(d>.5)discard;float a=smoothstep(.5,.0,d)+smoothstep(.5,.22,d)*.25;gl_FragColor=vec4(vC,a);}',transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  scene.add(new THREE.Points(geo,mat));
  return mat;
}

function buildSun(){
  scene.add(new THREE.Mesh(new THREE.IcosahedronGeometry(.7,16),new THREE.MeshBasicMaterial({color:0xfffbe0})));
  const cm=new THREE.ShaderMaterial({uniforms:{uT:{value:0}},vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 vN;uniform float uT;void main(){vec3 v=normalize(-vN);float f=pow(1.-abs(dot(vN,v)),2.2);gl_FragColor=vec4(1.,.9,.4,f*.55);}',transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.BackSide});
  scene.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.8,16),cm));
  scene.add(new THREE.PointLight(0xfff8e0,2.5,0,1.8));
  scene.add(new THREE.AmbientLight(0x0a0c18,.35));
  return cm;
}

const starMat=buildStars(),sunCorona=buildSun();

// PLANETS
const pMesh={},pLabel={};
P.forEach(p=>{
  const r=Math.max(0.05,Math.log(p.r+1)*0.08);
  const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(r,32),new THREE.MeshPhongMaterial({color:p.c,shininess:8}));
  mesh.userData={planet:p};
  scene.add(mesh);
  pMesh[p.id]={mesh,data:p};
  
  const orbitPts=[];
  for(let i=0;i<=180;i++){const th=i/180*Math.PI*2;orbitPts.push(new THREE.Vector3(p.e.a*Math.cos(th),0,p.e.a*Math.sin(th)));}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbitPts),new THREE.LineBasicMaterial({color:0x1a2848,transparent:true,opacity:.3,depthWrite:false})));
  
  pLabel[p.id]=(()=>{const el=document.createElement('div');el.className='olabel';el.textContent=p.name;document.body.appendChild(el);return el;})();
});

// CAMERA
const cam={theta:.5,phi:1.18,radius:48,tTheta:.5,tPhi:1.18,tRadius:48,target:new THREE.Vector3(),tTarget:new THREE.Vector3(),dragging:false,lx:0,ly:0,sens:.006};

function applyCamera(){
  cam.theta+=(cam.tTheta-cam.theta)*.09;cam.phi+=(cam.tPhi-cam.phi)*.09;cam.radius+=(cam.tRadius-cam.radius)*.11;cam.target.lerp(cam.tTarget,.09);
  const r=cam.radius,p=Math.max(.06,Math.min(Math.PI-.06,cam.phi));
  camera.position.set(cam.target.x+r*Math.sin(p)*Math.cos(cam.theta),cam.target.y+r*Math.cos(p),cam.target.z+r*Math.sin(p)*Math.sin(cam.theta));
  camera.lookAt(cam.target);
}

canvas.addEventListener('mousedown',e=>{cam.dragging=true;cam.lx=e.clientX;cam.ly=e.clientY;});
window.addEventListener('mouseup',()=>{cam.dragging=false;});
window.addEventListener('mousemove',e=>{if(!cam.dragging)return;cam.tTheta-=(e.clientX-cam.lx)*cam.sens;cam.tPhi=Math.max(.06,Math.min(Math.PI-.06,cam.tPhi-(e.clientY-cam.ly)*cam.sens));cam.lx=e.clientX;cam.ly=e.clientY;});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.tRadius=Math.max(.25,Math.min(280,cam.tRadius+e.deltaY*.04*(cam.tRadius/30)));},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape')window._deselect();});

// SELECTION
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let clickStart={x:0,y:0};

canvas.addEventListener('mousedown',e=>{clickStart.x=e.clientX;clickStart.y=e.clientY;});
canvas.addEventListener('click',e=>{
  if(Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)>5)return;
  mouse.x=(e.clientX/W)*2-1;mouse.y=-(e.clientY/H_)*2+1;
  ray.setFromCamera(mouse,camera);
  const targets=Object.values(pMesh).map(p=>p.mesh);
  const hits=ray.intersectObjects(targets);
  if(hits.length)selectPlanet(hits[0].object.userData.planet);
});

function selectPlanet(p){
  document.getElementById('p-name').textContent=p.name;
  document.getElementById('p-type').textContent=p.type;
  let html='<div>Radius &nbsp;<b>'+p.r.toFixed(0)+' km</b></div>';
  html+='<div>Mass &nbsp;<b>'+p.m.toExponential(2)+' kg</b></div>';
  html+='<div>Density &nbsp;<b>'+p.d.toFixed(2)+' g/cm³</b></div>';
  html+='<div>Gravity &nbsp;<b>'+p.g.toFixed(2)+' m/s²</b></div>';
  html+='<div>Rotation &nbsp;<b>'+Math.abs(p.rot).toFixed(2)+'h</b></div>';
  html+='<div>Moons &nbsp;<b>'+p.mo+'</b></div>';
  html+='<div>Orbit period &nbsp;<b>'+p.e.p.toFixed(1)+' days</b></div>';
  if(p.t.a)html+='<div>Avg temp &nbsp;<b>'+p.t.a+'°C</b></div>';
  document.getElementById('p-data').innerHTML=html;
  document.getElementById('p-fact').textContent=p.fact;
  document.getElementById('p-source').innerHTML='<strong>Source:</strong> '+p.src;
  document.getElementById('panel').classList.add('show');
  cam.tTarget.copy(pMesh[p.id].mesh.position);
  cam.tRadius=p.e.a*0.15;
}

window._deselect=function(){document.getElementById('panel').classList.remove('show');cam.tTarget.set(0,0,0);cam.tRadius=48;};

// HUD
function hud(){
  const d=simDate();
  const ds=d.toUTCString().slice(5,22);
  document.getElementById('tdt').textContent=ds+' UTC';
  document.getElementById('ts').textContent=simSpeed===1?'1×':simSpeed===3600?'1h/s':simSpeed===86400?'1d/s':'1mo/s';
  document.getElementById('td').textContent=cam.tRadius.toFixed(1)+' AU';
  document.getElementById('simdate').textContent=d.toLocaleDateString('en-GB',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
  document.getElementById('tf').textContent='Solar System';
}

// RENDER
let raf=0,drifting=false,_idleT=null;
function resetIdle(){drifting=false;clearTimeout(_idleT);_idleT=setTimeout(()=>{drifting=true;},8000);}
['mousedown','touchstart','wheel'].forEach(ev=>{window.addEventListener(ev,resetIdle);});
resetIdle();

const _proj=new THREE.Vector3();
function placeLabel(el,worldPos){
  _proj.copy(worldPos).project(camera);
  if(_proj.z>=1){el.style.display='none';return;}
  el.style.display='block';
  el.style.left=Math.round((_proj.x*.5+.5)*W)+'px';
  el.style.top=Math.round((-_proj.y*.5+.5)*H_)+'px';
}

function animate(){
  requestAnimationFrame(animate);
  tickSim();raf+=.016;
  
  starMat.uniforms.uT.value=raf;
  sunCorona.uniforms.uT.value=raf;
  
  if(drifting&&!cam.dragging)cam.tTheta+=.00014;
  
  P.forEach(p=>{
    const pos=planetPos(p.e,simDay);
    pMesh[p.id].mesh.position.copy(pos);
    pMesh[p.id].mesh.rotation.y+=.002;
    placeLabel(pLabel[p.id],pos);
  });
  
  applyCamera();
  if(Math.round(raf*60)%30===0)hud();
  renderer.render(scene,camera);
}

hud();animate();

const loader=document.getElementById('loader');
setTimeout(()=>{loader.style.opacity='0';setTimeout(()=>{if(loader.parentNode)loader.parentNode.removeChild(loader);},1500);},2200);

})();
</script>
