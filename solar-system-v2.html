<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Solar System Viewer</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #000;
			color: #fff;
		}
		canvas {
			border: 1px solid #fff;
		}
	</style>
</head>
<body>
	<h1>Solar System Viewer</h1>
	<canvas id="solarSystemCanvas" width="800" height="600"></canvas>
	<script>
		const canvas = document.getElementById('solarSystemCanvas');
		const ctx = canvas.getContext('2d');
		const solarSystem = {
			planets: [
				{ name: 'Mercury', distance: 57.91, radius: 2.44, color: 'gray' },
				{ name: 'Venus', distance: 108.2, radius: 6.05, color: 'orange' },
				{ name: 'Earth', distance: 149.6, radius: 6.37, color: 'blue' },
				{ name: 'Mars', distance: 227.9, radius: 3.39, color: 'red' },
				{ name: 'Jupiter', distance: 778.5, radius: 69.91, color: 'brown' },
				{ name: 'Saturn', distance: 1427, radius: 58.23, color: 'gold' },
				{ name: 'Uranus', distance: 2871, radius: 25.36, color: 'lightblue' },
				{ name: 'Neptune', distance: 4497.1, radius: 24.62, color: 'blue' }
			]
		};
		function drawPlanet(planet, angle) {
			const x = canvas.width / 2 + planet.distance * Math.cos(angle);
			const y = canvas.height / 2 + planet.distance * Math.sin(angle);
			ctx.fillStyle = planet.color;
			ctx.beginPath();
			ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
			ctx.fill();
			ctx.fillStyle = '#fff';
			ctx.fillText(planet.name, x - planet.radius, y - planet.radius);
		}
		function animate() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			const time = Date.now() * 0.001;
			for (let i = 0; i < solarSystem.planets.length; i++) {
				drawPlanet(solarSystem.planets[i], time / (i + 1));
			}
			requestAnimationFrame(animate);
		}
		animate();
	</script>
</body>
</html>
